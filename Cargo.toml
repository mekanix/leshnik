[package]
name = "leshnik"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
description = "Application which watches Nginx logs and feeds them to Loki"
authors = ["Goran Mekić"]
readme = "README.md"
repository = "https://github.com/mekanix/leshnik"
keywords = ["grafana", "loki", "nginx", "log"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
glob = "0.3"
inotify = "0.10"
maxminddb = "0.24"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
